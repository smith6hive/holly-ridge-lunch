name: Update lunch feeds

on:
  schedule:
    # 10:00 UTC daily = 6am ET in summer, 5am ET in winter.
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Rebuild feeds
        run: python build.py

      - name: Commit if the menus actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/; then
            echo "No menu changes."
            exit 0
          fi
          git add docs/
          git commit -m "Update lunch feeds ($(date -u +%Y-%m-%d))"
          git push
